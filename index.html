<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Reel</title>
<meta property="og:title" content="Te compartieron un título en Reel">
<meta property="og:description" content="Ábrelo en Reel para agregarlo a tu lista.">
<style>
  :root {
    --bg: #0b0b0d; --fg: #f5f5f7; --muted: rgba(245,245,247,.6);
    --accent: #ff453a; --card: rgba(255,255,255,.08);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2f2f7; --fg: #1c1c1e; --muted: rgba(28,28,30,.6); --card: rgba(0,0,0,.05); }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .backdrop {
    position: fixed; inset: 0; z-index: -1;
    background-size: cover; background-position: center;
    filter: blur(60px) saturate(1.4); opacity: .45; transform: scale(1.2);
  }
  main { width: min(360px, 100%); text-align: center; }
  .poster {
    width: 180px; aspect-ratio: 2 / 3; border-radius: 14px; margin: 0 auto 24px;
    background: var(--card) center / cover no-repeat;
    box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 0 0 .5px rgba(255,255,255,.15);
  }
  .kind { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 28px; text-wrap: balance; }
  .button {
    display: block; padding: 15px 20px; border-radius: 999px;
    font-weight: 600; text-decoration: none; color: #fff; background: var(--accent);
    transition: transform .16s ease-out, opacity .16s ease-out;
  }
  .button:active { transform: scale(.97); opacity: .85; }
  .secondary { margin-top: 12px; color: var(--fg); background: var(--card); }
  .note { margin-top: 20px; font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<main>
  <div class="poster" id="poster" role="img"></div>
  <p class="kind" id="kind">Reel</p>
  <h1 id="title">Te compartieron un título</h1>
  <a class="button" id="open" href="#">Abrir en Reel</a>
  <a class="button secondary" id="tmdb" href="https://www.themoviedb.org/">Ver en TMDB</a>
  <p class="note">Si no tienes Reel, el enlace de TMDB muestra la ficha completa.</p>
</main>
<script>
  // Todo viene en la URL: ?type=movie&id=123&t=Título&p=/poster.jpg&y=2026
  const q = new URLSearchParams(location.search);
  const type = q.get("type") === "tv" ? "tv" : "movie";
  const id = /^\d+$/.test(q.get("id") || "") ? q.get("id") : null;
  const title = (q.get("t") || "").slice(0, 200);
  const poster = /^\/[\w.-]+$/.test(q.get("p") || "") ? q.get("p") : null;
  const year = /^\d{4}$/.test(q.get("y") || "") ? q.get("y") : null;

  if (title) {
    document.getElementById("title").textContent = title;
    document.title = title + " · Reel";
    document.getElementById("poster").setAttribute("aria-label", "Póster de " + title);
  }
  document.getElementById("kind").textContent = [type === "tv" ? "Serie" : "Película", year].filter(Boolean).join(" · ");
  if (poster) {
    document.getElementById("poster").style.backgroundImage = `url(https://image.tmdb.org/t/p/w500${poster})`;
    document.getElementById("backdrop").style.backgroundImage = `url(https://image.tmdb.org/t/p/w185${poster})`;
  }
  if (id) {
    const app = new URL(`reel://title/${type}/${id}`);
    for (const key of ["t", "p", "y"]) if (q.get(key)) app.searchParams.set(key, q.get(key));
    document.getElementById("open").href = app.toString();
    document.getElementById("tmdb").href = `https://www.themoviedb.org/${type}/${id}`;
    // Con Reel instalada se abre sola; si no, la página se queda con los botones.
    setTimeout(() => { location.href = app.toString(); }, 350);
  } else {
    document.getElementById("open").style.display = "none";
  }
</script>
</body>
</html>
